<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RescueFlow AI — Intelligent Food Waste Prevention & Redistribution</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #14b8a6;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --bg: #f0fdfa;
      --card: #ffffff;
      --text: #134e4a;
      --muted: #5eead4;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 40%, #ccfbf1 100%);
      min-height: 100vh;
      color: var(--text);
      margin: 0;
    }

    /* ===== Auth Pages ===== */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(20, 184, 166, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(245, 158, 11, 0.18) 0%, transparent 50%),
        linear-gradient(160deg, #0f766e 0%, #134e4a 45%, #0d9488 100%);
      position: relative;
      overflow: hidden;
    }

    .auth-wrapper::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(12px);
    }

    .auth-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 10px 25px rgba(13, 148, 136, 0.4);
    }

    .auth-logo i { font-size: 2.2rem; color: white; }

    .auth-title {
      font-weight: 800;
      font-size: 1.65rem;
      text-align: center;
      color: #0f766e;
      margin-bottom: 0.25rem;
    }

    .auth-subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .form-label { font-weight: 600; color: #334155; font-size: 0.875rem; }

    .form-control, .form-select {
      border-radius: 0.75rem;
      border: 1.5px solid #e2e8f0;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      color: white;
      transition: all 0.25s;
      width: 100%;
    }

    .btn-primary-custom:hover {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.35);
      color: white;
    }

    .demo-accounts {
      background: #f0fdfa;
      border-radius: 0.85rem;
      padding: 1rem;
      margin-top: 1.5rem;
      border: 1px solid #99f6e4;
    }

    .demo-accounts h6 {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0f766e;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .demo-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: white;
      border: 1px solid #ccfbf1;
      border-radius: 0.6rem;
      padding: 0.55rem 0.85rem;
      margin-bottom: 0.4rem;
      font-size: 0.82rem;
      color: #134e4a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .demo-btn:hover {
      border-color: #14b8a6;
      background: #ecfdf5;
      transform: translateX(3px);
    }

    .demo-btn .role-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #ccfbf1;
      color: #0f766e;
    }

    /* ===== App Layout ===== */
    .app-shell { display: none; min-height: 100vh; }

    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0f766e 0%, #134e4a 100%);
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,0.12);
    }

    .sidebar-brand {
      padding: 1.4rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .sidebar-brand .logo-icon {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,0.15);
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .sidebar-brand h5 {
      margin: 0;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .sidebar-brand small {
      opacity: 0.7;
      font-size: 0.7rem;
    }

    .nav-section {
      padding: 1rem 0.75rem;
      flex: 1;
      overflow-y: auto;
    }

    .nav-link-custom {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 0.7rem;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      margin-bottom: 0.25rem;
      transition: all 0.2s;
      cursor: pointer;
    }

    .nav-link-custom:hover, .nav-link-custom.active {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .nav-link-custom i { font-size: 1.15rem; width: 22px; text-align: center; }

    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .user-info .name { font-weight: 600; font-size: 0.9rem; }
    .user-info .role { font-size: 0.75rem; opacity: 0.75; }

    .main-content {
      margin-left: 260px;
      min-height: 100vh;
      padding: 1.75rem 2rem;
      background: transparent;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-header h2 {
      font-weight: 800;
      font-size: 1.6rem;
      color: #0f766e;
      margin: 0;
    }

    .page-header p {
      color: #64748b;
      margin: 0.25rem 0 0;
      font-size: 0.95rem;
    }

    /* Cards & Stats */
    .stat-card {
      background: white;
      border-radius: 1.1rem;
      padding: 1.35rem;
      box-shadow: 0 4px 20px rgba(13, 148, 136, 0.08);
      border: 1px solid rgba(13, 148, 136, 0.08);
      height: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(13, 148, 136, 0.14);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      margin-bottom: 0.85rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f766e;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.2rem;
    }

    .card-custom {
      background: white;
      border-radius: 1.1rem;
      border: 1px solid rgba(13, 148, 136, 0.08);
      box-shadow: 0 4px 20px rgba(13, 148, 136, 0.06);
      overflow: hidden;
    }

    .card-custom .card-header {
      background: transparent;
      border-bottom: 1px solid #e2e8f0;
      padding: 1.1rem 1.35rem;
      font-weight: 700;
      color: #0f766e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-custom .card-body { padding: 1.35rem; }

    /* Tables */
    .table-custom {
      margin: 0;
      font-size: 0.9rem;
    }

    .table-custom thead th {
      background: #f0fdfa;
      color: #0f766e;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border: none;
      padding: 0.85rem 1rem;
    }

    .table-custom tbody td {
      padding: 0.9rem 1rem;
      vertical-align: middle;
      border-color: #f1f5f9;
    }

    .badge-status {
      font-weight: 600;
      font-size: 0.72rem;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
    }

    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-matched { background: #dbeafe; color: #1d4ed8; }
    .badge-picked { background: #d1fae5; color: #047857; }
    .badge-completed { background: #ccfbf1; color: #0f766e; }
    .badge-urgent { background: #fee2e2; color: #b91c1c; }
    .badge-high { background: #ffedd5; color: #c2410c; }
    .badge-medium { background: #fef9c3; color: #a16207; }
    .badge-low { background: #ecfdf5; color: #047857; }

    /* Forms inside app */
    .form-section-title {
      font-weight: 700;
      color: #0f766e;
      font-size: 1.05rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Urgency indicator */
    .urgency-bar {
      height: 6px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .urgency-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: #94a3b8;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Mobile */
    .mobile-toggle {
      display: none;
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 200;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: white;
      border: none;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.4);
      font-size: 1.4rem;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; padding: 1.25rem; }
      .mobile-toggle { display: flex; align-items: center; justify-content: center; }
    }

    /* Toast */
    .toast-container { z-index: 1100; }

    /* Role specific accent */
    .role-donor .stat-icon { background: #ccfbf1; color: #0d9488; }
    .role-ngo .stat-icon { background: #dbeafe; color: #2563eb; }
    .role-volunteer .stat-icon { background: #ffedd5; color: #ea580c; }
    .role-admin .stat-icon { background: #e0e7ff; color: #4f46e5; }

    /* Food type pills */
    .food-type-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #f0fdfa;
      color: #0f766e;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #99f6e4;
    }

    /* Department chips on register */
    .dept-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: white;
      color: #475569;
    }

    .dept-chip:hover, .dept-chip.active {
      border-color: #14b8a6;
      background: #ecfdf5;
      color: #0f766e;
    }

    .dept-chip.active { box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2); }

    /* Smooth page switch */
    .page-view { display: none; animation: fadeIn 0.3s ease; }
    .page-view.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Impact progress */
    .impact-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: conic-gradient(#14b8a6 0% 72%, #e2e8f0 72% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .impact-ring::before {
      content: '';
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: white;
    }

    .impact-ring span {
      position: relative;
      font-weight: 800;
      font-size: 1.1rem;
      color: #0f766e;
    }
  </style>
</head>
<body>

  <!-- ==================== AUTH SECTION ==================== -->
  <div id="authSection" class="auth-wrapper">
    <!-- LOGIN -->
    <div id="loginCard" class="auth-card">
      <div class="auth-logo"><i class="bi bi-heart-pulse-fill"></i></div>
      <h1 class="auth-title">RescueFlow AI</h1>
      <p class="auth-subtitle">From surplus to shared meals — faster & safer</p>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe" />
          <label class="form-check-label" for="rememberMe" style="font-size:0.9rem">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary-custom">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <p class="text-center mt-3 mb-0" style="font-size:0.9rem;color:#64748b">
        Don't have an account?
        <a href="#" onclick="showSignup()" style="color:#0d9488;font-weight:600;text-decoration:none">Sign up</a>
      </p>

      <div class="demo-accounts">
        <h6><i class="bi bi-lightning-charge-fill me-1"></i> Quick Demo Login</h6>
        <button class="demo-btn" onclick="demoLogin('donor@rescueflow.demo','donor')">
          <span>donor@rescueflow.demo</span>
          <span class="role-badge">Donor</span>
        </button>
        <button class="demo-btn" onclick="demoLogin('ngo@rescueflow.demo','ngo')">
          <span>ngo@rescueflow.demo</span>
          <span class="role-badge">NGO / Recipient</span>
        </button>
        <button class="demo-btn" onclick="demoLogin('volunteer@rescueflow.demo','volunteer')">
          <span>volunteer@rescueflow.demo</span>
          <span class="role-badge">Volunteer</span>
        </button>
        <button class="demo-btn" onclick="demoLogin('admin@rescueflow.demo','admin')">
          <span>admin@rescueflow.demo</span>
          <span class="role-badge">Administrator</span>
        </button>
      </div>
    </div>

    <!-- SIGNUP -->
    <div id="signupCard" class="auth-card" style="display:none; max-width:480px;">
      <div class="auth-logo"><i class="bi bi-person-plus-fill"></i></div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the movement against food waste</p>

      <form id="signupForm" onsubmit="return handleSignup(event)">
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="signupName" required />
          </div>
          <div class="col-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="signupEmail" required />
          </div>
        </div>
        <div class="mt-2">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="signupPassword" minlength="6" required />
        </div>
        <div class="mt-2">
          <label class="form-label">I am a...</label>
          <select class="form-select" id="signupRole" required>
            <option value="">Select role</option>
            <option value="donor">Food Donor (Restaurant / Supermarket / Storage / Bakery etc.)</option>
            <option value="ngo">NGO / Orphanage / Community Center / Shelter</option>
            <option value="volunteer">Volunteer (Pickup & Delivery)</option>
          </select>
        </div>
        <div class="mt-2" id="orgNameGroup" style="display:none;">
          <label class="form-label">Organization / Business Name</label>
          <input type="text" class="form-control" id="signupOrg" />
        </div>
        <div class="mt-2">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-control" id="signupPhone" placeholder="+91 98765 43210" />
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-primary-custom">
            <i class="bi bi-check2-circle me-2"></i>Create Account
          </button>
        </div>
      </form>

      <p class="text-center mt-3 mb-0" style="font-size:0.9rem;color:#64748b">
        Already have an account?
        <a href="#" onclick="showLogin()" style="color:#0d9488;font-weight:600;text-decoration:none">Sign in</a>
      </p>
    </div>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div id="appShell" class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon"><i class="bi bi-heart-pulse-fill"></i></div>
        <div>
          <h5>RescueFlow AI</h5>
          <small>VisionQuad</small>
        </div>
      </div>

      <nav class="nav-section" id="sidebarNav">
        <!-- Filled by JS based on role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">U</div>
          <div>
            <div class="name" id="userName">User</div>
            <div class="role" id="userRoleLabel">Role</div>
          </div>
        </div>
        <button class="btn btn-sm w-100" style="background:rgba(255,255,255,0.12);color:white;border:none;border-radius:0.6rem;" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Pages injected by role -->
    </main>
  </div>

  <!-- Mobile menu toggle -->
  <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Menu">
    <i class="bi bi-list"></i>
  </button>

  <!-- Toast container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ==================== DATA & STATE ====================
    const DEMO_USERS = {
      'donor@rescueflow.demo': { password: 'demo123', role: 'donor', name: 'GreenLeaf Restaurant', org: 'GreenLeaf Restaurant' },
      'ngo@rescueflow.demo': { password: 'demo123', role: 'ngo', name: 'Hope Foundation', org: 'Hope Foundation NGO' },
      'volunteer@rescueflow.demo': { password: 'demo123', role: 'volunteer', name: 'Arjun Mehta', org: null },
      'admin@rescueflow.demo': { password: 'demo123', role: 'admin', name: 'System Admin', org: 'RescueFlow HQ' }
    };

    let currentUser = null;

    function urgencyBadge(score) {
      if (score >= 85) return `<span class="badge-status badge-urgent">Urgent ${score}</span>`;
      if (score >= 60) return `<span class="badge-status badge-high">High ${score}</span>`;
      if (score >= 40) return `<span class="badge-status badge-medium">Medium ${score}</span>`;
      return `<span class="badge-status badge-low">Low ${score}</span>`;
    }

    function statusBadge(s) {
      const map = {
        'Available': 'badge-pending',
        'Matched': 'badge-matched',
        'Picked Up': 'badge-picked',
        'Completed': 'badge-completed',
        'Pending': 'badge-pending',
        'Accepted': 'badge-matched'
      };
      return `<span class="badge-status ${map[s] || 'badge-pending'}">${s}</span>`;
    }

    function showToast(msg, type = 'success') {
      const container = document.querySelector('.toast-container');
      const id = 't' + Date.now();
      const bg = type === 'success' ? 'bg-success' : type === 'danger' ? 'bg-danger' : 'bg-warning text-dark';
      container.insertAdjacentHTML('beforeend', `
        <div id="${id}" class="toast align-items-center text-white ${bg} border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">${msg}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>
      `);
      const t = new bootstrap.Toast(document.getElementById(id), { delay: 3200 });
      t.show();
    }

    function selectDept(el) {
      document.querySelectorAll('.dept-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('regDept').value = el.dataset.dept;
    }

    function submitDonation(e) {
      e.preventDefault();
      const dept = document.getElementById('regDept').value;
      if (!dept) {
        showToast('Please select a department / source type', 'warning');
        return false;
      }
      const food = document.getElementById('regFood').value;
      const qty = document.getElementById('regQty').value;
      const condition = document.getElementById('regCondition').value;
      const expiry = document.getElementById('regExpiry').value;
      const location = document.getElementById('regLocation').value;
      const notes = document.getElementById('regNotes').value;

      // Simple urgency simulation
      const hoursLeft = Math.max(1, (new Date(expiry) - new Date()) / 3600000);
      let urgency = Math.min(99, Math.round(100 - hoursLeft * 2));
      if (condition.includes('Near expiry') || condition.includes('Hot')) urgency = Math.min(99, urgency + 15);

      const newId = donations.length + 1;
      donations.unshift({
        id: newId,
        donor: currentUser.org || currentUser.name,
        dept,
        food,
        qty,
        condition,
        expiry: expiry.replace('T', ' '),
        urgency,
        status: 'Available',
        location,
        notes
      });

      showToast(`Surplus registered! AI urgency score: ${urgency}. Awaiting match.`, 'success');
      navigateTo('myDonations');
      return false;
    }
